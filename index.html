<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vuelve</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15111A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Karla:wght@400;600&display=swap">
<style>
:root{
  --papel:#F7F5F9; --tinta:#241C2B; --acento:#B4306A;
  --susurro:#7D7488; --susurro:color-mix(in srgb,var(--tinta) 52%,var(--papel));
  --linea:#E4DFEA; --linea:color-mix(in srgb,var(--tinta) 13%,var(--papel));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#15111A; --tinta:#F3EFF6; --acento:#E86FA0;
  --susurro:color-mix(in srgb,var(--tinta) 56%,var(--papel));
  --linea:color-mix(in srgb,var(--tinta) 18%,var(--papel));
}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--papel);color:var(--tinta);
  font-family:"Karla","Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(44px,12vw,72px);
  letter-spacing:-.04em;margin:0;line-height:1}
h1 i{font-style:normal;color:var(--acento)}
p{margin:18px 0 0;max-width:34ch;color:var(--susurro);font-size:17px}
.linea{width:54px;height:2px;background:var(--acento);margin:26px 0}
small{color:var(--susurro);font-size:13.5px;margin-top:auto;padding-top:40px}
a{color:var(--tinta);text-decoration:none;border-bottom:1px solid var(--linea)}
a:hover{border-color:var(--acento);color:var(--acento)}
</style>
</head>
<body>
  <h1>Vuelve<i>.</i></h1>
  <div class="linea"></div>
  <p>La herramienta que le dice a un negocio a qué cliente le toca volver, antes de que se vaya a otro lado.</p>
  <small>Hecho por <a href="https://dayannaaguirre.com">Dayanna Aguirre</a></small>
</body>
</html>
